[project]
name = "ratelimit-gateway"
version = "0.1.0"
description = "API gateway with distributed rate limiting: token bucket and sliding window in Redis Lua, consistent hashing, LRU cache, Bloom filter"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "redis==8.1.0",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.168.5", "ruff==0.17.0", "fakeredis[lua]==2.39.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rlg"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
