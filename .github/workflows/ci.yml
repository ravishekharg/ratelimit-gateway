name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + unit/property tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  compose:
    name: integration + load test (3 Redis shards, 2 gateway replicas)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: docker compose up -d --build --wait
      - run: python scripts/loadtest.py --requests 5000 --concurrency 50 --out results.json
      - name: summary
        if: always()
        run: python scripts/summary.py results.json "Docker Compose" >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: docker compose logs --tail 100
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: compose-results, path: results.json }

  kind:
    name: deploy to Kubernetes (kind) + exactness across pods
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: kind cluster
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64 && chmod +x kind
          printf 'kind: Cluster\napiVersion: kind.x-k8s.io/v1alpha4\nnodes: [{role: control-plane}, {role: worker}, {role: worker}]\n' > kind.yaml
          ./kind create cluster --config kind.yaml --wait 120s
      - name: build and load image
        run: |
          docker build -t ghcr.io/ravishekharg/ratelimit-gateway:0.1.0 .
          ./kind load docker-image ghcr.io/ravishekharg/ratelimit-gateway:0.1.0
      - name: deploy
        run: |
          kubectl apply -f deploy/k8s/ratelimit.yaml
          kubectl -n ratelimit patch configmap gateway-config --type merge -p \
            '{"data":{"PLANS":"{\"burst\":{\"algo\":\"token_bucket\",\"capacity\":50,\"rate\":0.01},\"window\":{\"algo\":\"sliding_window\",\"limit\":30,\"window\":60},\"free\":{\"algo\":\"token_bucket\",\"capacity\":10,\"rate\":1},\"perf\":{\"algo\":\"token_bucket\",\"capacity\":1000000,\"rate\":1000}}"}}'
          kubectl -n ratelimit rollout status sts/redis --timeout=180s
          kubectl -n ratelimit rollout restart deploy/gateway
          kubectl -n ratelimit rollout status deploy/gateway --timeout=180s
          kubectl -n ratelimit get pods -o wide
      - name: exactness across the 3 gateway pods (load test runs in-cluster as a Job)
        run: |
          # address each Ready, non-terminating gateway pod directly (a Service would hide which pod answers)
          ips=$(kubectl -n ratelimit get pods -l app=gateway -o json | python -c "
          import json, sys
          for p in json.load(sys.stdin)['items']:
              ready = any(c['type'] == 'Ready' and c['status'] == 'True' for c in p['status'].get('conditions', []))
              if ready and not p['metadata'].get('deletionTimestamp'):
                  print(p['status']['podIP'])")
          gws=$(for ip in $ips; do printf 'http://%s:8080,' "$ip"; done); gws=${gws%,}
          echo "gateways: $gws"
          kubectl -n ratelimit create configmap loadtest --from-file=scripts/loadtest.py
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata: { name: loadtest, namespace: ratelimit }
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: loadtest
                    image: ghcr.io/ravishekharg/ratelimit-gateway:0.1.0
                    command: ["python", "/scripts/loadtest.py", "--gateways", "$gws",
                              "--redis", "redis://redis-0.redis:6379,redis://redis-1.redis:6379,redis://redis-2.redis:6379",
                              "--upstream", "http://upstream:5678", "--requests", "3000", "--concurrency", "50",
                              "--out", "/tmp/results.json"]
                    volumeMounts: [{ name: scripts, mountPath: /scripts }]
                volumes: [{ name: scripts, configMap: { name: loadtest } }]
          EOF
          kubectl -n ratelimit wait --for=condition=complete job/loadtest --timeout=300s || true
          kubectl -n ratelimit logs job/loadtest | tee loadtest.log
          python - <<'PY'
          import json
          text = open("loadtest.log").read()
          json.dump(json.loads(text[text.index("{"):]), open("k8s-results.json", "w"), indent=2)
          PY
          python -c "import json, sys; sys.exit(0 if json.load(open('k8s-results.json'))['passed'] else 1)"
      - name: summary
        if: always()
        run: python scripts/summary.py k8s-results.json "Kubernetes (kind, 3 gateway pods, 3 Redis shards)" >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: kubectl -n ratelimit logs deploy/gateway --tail 100 --all-containers

  iac:
    name: terraform + manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - working-directory: terraform/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary deploy/k8s/ratelimit.yaml
